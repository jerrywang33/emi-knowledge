  - DORA-ICT-INCIDENT-SOURCES-2026-09-07-R1
scope:
  summary: ICT incident management, classification, major-incident reporting, and voluntary significant-cyber-threat notification for electronic money institutions under DORA, including the Malta public reporting route.
  includes:
    - Recording, detection, handling, escalation, response, recovery, root-cause analysis, follow-up, communication, and evidence retention for ICT-related incidents.
    - Classification criteria and materiality thresholds for major ICT-related incidents, including recurring incidents where applicable.
    - Initial notification, intermediate report, final report, reclassification, secure submission, and reporting-outsourcing procedures.
    - Voluntary classification and notification of significant cyber threats.
    - The DORA Chapter III path for operational or security payment-related incidents affecting electronic money institutions.
  excludes:
    - Institution-specific incident decisions, internal severity thresholds, staffing models, and risk acceptance.
    - Automatic submission to a competent authority or automatic approval of an incident classification.
    - Business continuity, resilience testing, and ICT third-party risk as complete standalone topics.
