open_questions:
  - Confirm the current MFSA process, template, and submission route for non-ICT major operational or security payment-related incidents under DORA Article 23.
  - Confirm whether and how MFSA requests annual aggregated cost and loss estimates under DORA Article 11(10).
  - Confirm stable dates, versions, and replacement relationships for MFSA portal user guides.
  - Confirm the Provision granularity for the data fields in the annexes to Commission Implementing Regulation (EU) 2025/302.
