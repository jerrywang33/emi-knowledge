open_questions:
  - Confirm the current AX05, Minimum Requirements Guidelines, and Addendum versions and submission scope for a Malta EMI authorisation task.
  - Confirm whether MFSA currently requires an EMI-specific continuity, recovery, or evidence template or submission route beyond the public DORA materials.
  - Confirm the institution's EMD2 Article 9(1) exemption status before selecting the full or simplified ICT risk management branch.
