title: DORA ICT business continuity, backup, and recovery
language: en
domain: dora
lifecycle_status: draft
source_review_ids:
  - DORA-SOURCES-2026-08-31-R2
  - DORA-ICT-CONTINUITY-SOURCES-2026-09-07-R1
scope:
  summary: ICT business continuity, backup, restoration, and recovery requirements and controls for electronic money institutions under the full and simplified DORA ICT risk management frameworks, with current Malta authorisation observations as supporting context.
  includes:
    - Full-framework identification, business impact analysis, ICT business continuity policy, plans, response and recovery arrangements, crisis management, testing, review, and activation records.
    - Backup scope and frequency, secure activation, segregated restoration, redundant capacity, recovery objectives, data-integrity checks, and reconciliation.
    - Simplified-framework business continuity plans, response and recovery measures, backup and restoration, testing, findings, remediation, and management reporting.
    - Disruption scenarios involving cyber-attacks, ICT assets, communication infrastructure, premises, staff, power, environment, and relevant ICT third-party services.
    - Public MFSA supervisory context on continuity, BIA, response and recovery, backup, restoration, and severe-disruption scenarios in authorisation applications.
  excludes:
    - Institution-specific critical-function inventories, BIA conclusions, recovery objectives, backup frequencies, activation thresholds, recovery architectures, and risk acceptance.
    - DORA Chapter IV digital operational resilience testing and threat-led penetration testing as complete standalone topics.
    - DORA Chapter V ICT third-party risk, contracts, subcontracting, exit, and register-of-information requirements as a complete standalone topic.
    - Entity-specific requirements for central counterparties, central securities depositories, data reporting service providers, and trading venues.
    - Automatic disaster declaration, plan activation, recovery acceptance, or compliance approval by an Agent.
