title: DORA ICT change management
language: en
domain: dora
lifecycle_status: approved
source_review_ids:
  - DORA-SOURCES-2026-08-31-R2
scope:
  summary: ICT change management requirements and controls for electronic money institutions under the full and simplified DORA ICT risk management frameworks.
  includes:
    - Full-framework ICT change policies, procedures, controls, approval, testing, fallback, and post-implementation verification.
    - Simplified-framework ICT system acquisition, development, project management, change management, security testing, and major-change risk assessment.
    - Public MFSA context on ICT change lifecycle and material ICT changes.
  excludes:
    - Institution-specific change classifications, approval roles, risk tolerances, and evidence retention periods.
    - ICT incident management, business continuity, digital operational resilience testing, and ICT third-party risk as complete topics.
