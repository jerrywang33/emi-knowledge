id: ver-secure-regulatory-submission
type: verification
schema_version: 0.1.0
revision: 1
title: Verify secure and authorised regulatory submission
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
control_ids: [ctl-secure-regulatory-submission]
verification_type: inspection
execution_mode: hybrid
executor_role: regulatory_submission_assurance
operation_mode: event_driven
trigger_or_frequency: After each submission attempt and after material channel or access-policy changes
preconditions:
  - The approved package, package digest, authority route, access policy, submission actor, channel status, and authority responses are available.
procedure:
  - Confirm the selected channel matches the authority, jurisdiction, entity, event type, and report stage, including applicable MFSA CRMS routes.
  - Confirm the authenticated sender held the approved role and release decision for the exact package and destination.
  - Compare the transmitted digest with the approved package and inspect receipt, destination, and submission time.
  - For fallback use, confirm technical impossibility, an authority-agreed secure means, authority contact, and required primary-channel resubmission.
expected_result: The approved package reaches the correct authority through an authorised secure path with intact content and a complete receipt or fallback trail.
failure_criteria:
  - The channel, destination, actor, or package differs from the approved submission data.
  - Delivery lacks a receipt or verified authority response and no follow-up exists.
  - Fallback transmission is insecure, unagreed, unsupported by technical-impossibility evidence, or lacks required resubmission.
on_failure: Treat delivery as unverified, escalate immediately, contact the authority through an approved route, and resubmit when authorised.
evidence_requirements:
  - key: submission-authorisation-and-route
    artifact_type: approval_record
    description: Approved destination, channel, actor, access decision, and exact package identity.
    required_fields: [case identifier, authority, channel, event type, report stage, package digest, sender identity, sender role, approver, approved at]
    source_status: institution_defined
    source_system: null
    retention_status: institution_defined
    retention_period: null
    data_classifications: [internal, confidential, personal_data]
    redaction_required: true
    open_questions: []
  - key: authority-submission-receipt
    artifact_type: other
    description: Transmission, authority receipt, fallback, and resubmission evidence for the exact package.
    required_fields: [case identifier, package digest, destination, submitted at, delivery result, authority receipt, fallback reason, authority contact, resubmission outcome]
    source_status: institution_defined
    source_system: null
    retention_status: institution_defined
    retention_period: null
    data_classifications: [internal, confidential, personal_data, restricted]
    redaction_required: true
    open_questions: []
