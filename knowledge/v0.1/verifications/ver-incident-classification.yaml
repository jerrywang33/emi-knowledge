id: ver-incident-classification
type: verification
schema_version: 0.1.0
revision: 1
title: Verify incident and significant-threat classification
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
control_ids: [ctl-incident-classification]
verification_type: review
execution_mode: hybrid
executor_role: classification_assurance
operation_mode: event_driven
trigger_or_frequency: At each classification conclusion and after material input changes
preconditions:
  - The current legal criteria and thresholds, case facts, estimates, calculations, and classification history are available.
procedure:
  - Confirm every prescribed criterion has a value, justified estimate, or explicit unavailable status.
  - Recalculate the major-incident result using the critical-service condition and prescribed combination rule.
  - For a significant cyber threat, confirm all function or party, probability, and hypothetical materiality conditions are evidenced.
  - Confirm source-rule version, assessor, timestamps, changes, and prior conclusions are retained.
expected_result: The classification is complete, reproducible from current source rules and facts, and preserves every assessment revision.
failure_criteria:
  - A prescribed criterion is omitted or an estimate is presented as an actual value.
  - An internal severity threshold replaces or alters a legal major-incident condition.
  - The conclusion cannot be reproduced or prior assessment history is missing.
on_failure: Mark the classification unverified, apply conservative escalation, correct the assessment, and repeat review.
evidence_requirements:
  - key: classification-assessment
    artifact_type: document
    description: Versioned incident or significant-threat criteria assessment and conclusion.
    required_fields: [case identifier, assessment type, source-rule version, criterion inputs, estimate flags, calculations, conclusion, assessor, assessment timestamp]
    source_status: institution_defined
    source_system: null
    retention_status: institution_defined
    retention_period: null
    data_classifications: [internal, confidential, personal_data, restricted]
    redaction_required: true
    open_questions: []
  - key: classification-history
    artifact_type: audit_log
    description: Immutable history of classification submissions and reassessments.
    required_fields: [case identifier, revision, actor, timestamp, prior conclusion, new conclusion, changed inputs, reason]
    source_status: institution_defined
    source_system: null
    retention_status: institution_defined
    retention_period: null
    data_classifications: [internal, confidential, personal_data]
    redaction_required: true
    open_questions: []
