heading: Testing of the ICT business continuity plans
content_kind: editorial_summary
content: Full-framework entities use continuity-plan tests to assess whether critical or important functions can continue. Tests cover severe but plausible disruption scenarios used in plan development, applicable third-party ICT services and provider failure or jurisdictional political risk, assumption challenges, and the response ability of staff, providers, systems and services; entities other than microenterprises also test switchover to redundant capacity, backups and facilities and verify sustained operation and restoration.
