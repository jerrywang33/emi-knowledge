heading: Reporting of major ICT-related incidents and voluntary notification of significant cyber threats
content_kind: editorial_summary
content: Financial entities report major ICT-related incidents to the relevant competent authority, produce and submit the initial notification and reports after collecting and analysing relevant information using the Article 20 templates, use alternative notification means if technical impossibility prevents initial template submission, and include information needed to determine incident significance and possible cross-border impact.
