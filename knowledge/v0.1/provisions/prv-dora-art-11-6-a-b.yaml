heading: Response and recovery
content_kind: editorial_summary
content: Financial entities test ICT business continuity and ICT response and recovery plans for ICT systems supporting all functions at least yearly and after substantive changes to ICT systems supporting critical or important functions, and also test their crisis communication plans.
