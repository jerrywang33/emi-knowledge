content: The significant-cyber-threat template and glossary specify notifying-entity and contact information, detection and relevant timestamps, threat description, status, changes and potential impact, hypothetical major-incident classification criteria, prevention actions, other notifications, indicators of compromise and other available relevant information, with mandatory conditions and field formats.
