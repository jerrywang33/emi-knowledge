heading: Notification of outsourcing of the reporting obligations
content_kind: editorial_summary
content: A financial entity informs its competent authority of a reporting outsourcing arrangement as soon as it is concluded and before the first outsourced submission, provides the third party's name, contact details and identification code, and informs the authority as soon as reporting is no longer outsourced.
