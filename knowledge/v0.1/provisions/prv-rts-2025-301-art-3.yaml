heading: Specific information to be provided in intermediate reports
content_kind: editorial_summary
content: An intermediate report provides at least the authority incident reference where applicable, occurrence and regular-activity recovery timestamps, fulfilled major-classification criteria, incident type, applicable threat-actor techniques, affected functions, processes and infrastructure, client financial-interest impact, reports to other authorities, temporary recovery actions and applicable indicators of compromise.
