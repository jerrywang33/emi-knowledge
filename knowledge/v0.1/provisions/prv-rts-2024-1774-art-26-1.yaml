heading: ICT response and recovery plans
content_kind: editorial_summary
content: Full-framework entities develop BIA-informed ICT response and recovery plans that define activation and deactivation conditions and exceptions, actions to preserve availability, integrity, continuity and recovery of systems and services supporting critical or important functions, recovery-objective alignment, assigned roles, readily accessible documentation, short- and long-term options including partial recovery, plan objectives, and successful-execution criteria.
