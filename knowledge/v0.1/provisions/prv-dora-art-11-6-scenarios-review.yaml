heading: Response and recovery
content_kind: editorial_summary
content: Continuity testing by financial entities other than microenterprises includes cyber-attack scenarios and switching from primary infrastructure to redundant capacity, backups, and redundant facilities; all financial entities regularly review their continuity policy and response and recovery plans using test, audit, and supervisory findings.
