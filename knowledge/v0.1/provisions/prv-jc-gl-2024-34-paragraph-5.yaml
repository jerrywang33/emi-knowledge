heading: Provisions on the estimation of aggregated annual costs and losses of major ICT-related incidents
content_kind: editorial_summary
content: Financial entities aggregate costs and losses falling within the requested reference year, choose either a completed calendar year or a completed accounting year with finalised financial statements, apply that choice to future estimates, exclude amounts outside the reference year, and may change the choice after notifying the authority if it does not object within two months.
