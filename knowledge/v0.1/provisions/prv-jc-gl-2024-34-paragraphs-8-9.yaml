heading: Provisions on the estimation of aggregated annual costs and losses of major ICT-related incidents
content_kind: editorial_summary
content: Estimates use costs, losses, recoveries and accounting provisions reflected in the reference year's financial statements or applicable supervisory reporting; where accurate data is unavailable, other available information is used to the extent possible, and adjustments to an earlier year's submitted estimate are included in the reference year in which they are made.
