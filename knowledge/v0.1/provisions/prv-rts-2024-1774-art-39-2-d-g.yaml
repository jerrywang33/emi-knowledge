heading: Components of the ICT business continuity plan
content_kind: editorial_summary
content: Simplified-framework continuity plans establish recovery levels and timeframes for functions and key dependencies, activation conditions and availability, continuity and recovery actions, restoration measures for critical or important functions, supporting processes, information assets and interdependencies, and risk-based backup scope and minimum frequency; recovery measures also mitigate failures of critical third-party providers.
