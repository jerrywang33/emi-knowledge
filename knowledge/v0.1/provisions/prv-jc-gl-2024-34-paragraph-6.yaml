heading: Provisions on the estimation of aggregated annual costs and losses of major ICT-related incidents
content_kind: editorial_summary
content: The estimate includes every incident classified as major for which the entity submitted a final report in the reference year, plus any incident with a final report submitted in an earlier reference year that had a quantifiable financial impact in the current reference year.
