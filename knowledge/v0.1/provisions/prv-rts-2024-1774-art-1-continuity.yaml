heading: Overall risk profile and complexity
content_kind: editorial_summary
content: When developing and implementing the Title II ICT policies, procedures, protocols and tools and the Title III simplified framework, financial entities take account of their size, overall risk profile, and the nature, scale and complexity of their services, activities and operations, including the effect of ICT risk and disruption on data and operational continuity and availability.
