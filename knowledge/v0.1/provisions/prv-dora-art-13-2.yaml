heading: Learning and evolving
content_kind: editorial_summary
content: After a major ICT-related incident disrupts core activities, the financial entity reviews its causes and required improvements, assesses whether procedures were followed and actions were effective across alert response, impact and severity assessment, forensics where appropriate, escalation and communication, and, unless it is a microenterprise, communicates implemented changes to the competent authority on request.
