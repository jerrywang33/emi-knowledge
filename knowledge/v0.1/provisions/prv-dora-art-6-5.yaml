heading: ICT risk management framework
content_kind: editorial_summary
content: The documented ICT risk management framework is reviewed at least annually, periodically for microenterprises, and upon a major ICT-related incident, supervisory instruction, or relevant testing or audit conclusion; it is continuously improved from implementation and monitoring lessons, and its review report is submitted to the competent authority on request.
