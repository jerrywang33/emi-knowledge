content: Final fields cover incident and root-cause resolution status and timing, cause categories and detailed analysis, permanent corrective action, procedural changes, additional controls and lessons, timing differences, applicable resolution-authority impact, detailed economic impact, financial recoveries and recurring-incident information, with conditional mandatory rules and field formats.
