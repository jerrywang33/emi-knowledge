    - {kind: paragraph, value: "4"}
heading: Reporting of major ICT-related incidents and voluntary notification of significant cyber threats
content_kind: editorial_summary
content: Within prescribed time limits, financial entities submit an initial notification; an intermediate report and further updates whenever incident status or handling changes significantly, relevant status information becomes available or the authority requests one; and a final report after root-cause analysis is complete and actual impact figures can replace estimates, regardless of mitigation implementation status.
