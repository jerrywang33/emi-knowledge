heading: Learning and evolving
content_kind: editorial_summary
content: Lessons from real incidents and continuity or recovery challenges are continuously incorporated into ICT risk assessment and relevant framework reviews; incident trends and patterns are analysed, and senior ICT staff report the resulting findings and recommendations to the management body at least annually.
