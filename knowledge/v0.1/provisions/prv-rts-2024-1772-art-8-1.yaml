heading: Major incidents
content_kind: editorial_summary
content: An incident is major for DORA Article 19(1) when it affects critical services under Article 6 and either meets the Article 9(5)(b) malicious unauthorised access threshold or meets at least two of the other materiality thresholds in Article 9(1) to (6).
