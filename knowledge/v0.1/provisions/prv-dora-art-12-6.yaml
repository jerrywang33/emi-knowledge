heading: Backup policies and procedures, restoration and recovery procedures and methods
content_kind: editorial_summary
content: Financial entities determine recovery time and recovery point objectives for each function by considering whether it is critical or important and its potential overall effect on market efficiency, and set objectives that preserve agreed service levels under extreme scenarios.
