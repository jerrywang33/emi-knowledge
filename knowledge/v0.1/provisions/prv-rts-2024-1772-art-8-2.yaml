  label: Article 8(2)
  segments:
    - {kind: article, value: "8"}
    - {kind: paragraph, value: "2"}
heading: Major incidents
content_kind: editorial_summary
content: Non-major incidents are treated collectively as one major incident when they occur at least twice within six months, share the same apparent root cause and collectively meet Article 8(1). Financial entities assess recurrence monthly; this rule excludes microenterprises and DORA Article 16(1) entities.
