heading: Simplified ICT risk management framework
content_kind: editorial_summary
content: The simplified ICT risk management framework is documented and reviewed periodically and upon a major ICT-related incident in compliance with supervisory instructions, continuously improved from implementation and monitoring lessons, and its review report is submitted to the competent authority on request.
