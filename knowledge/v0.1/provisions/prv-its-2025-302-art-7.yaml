heading: Aggregated reporting
content_kind: editorial_summary
content: An outsourced reporting provider may aggregate one provider-originated major incident affecting multiple clients only when each affected entity classifies it as major, all covered entities are in one Member State under the same competent authority, and that authority has explicitly allowed aggregation for the entity type. Listed entity types must report individually, and any financial entity provides an individual report when the authority requests its impact.
