heading: Backup policies and procedures, restoration and recovery procedures and methods
content_kind: editorial_summary
content: Financial entities establish backup systems that can be activated under approved procedures without jeopardising network and information-system security or data availability, authenticity, integrity, or confidentiality, and periodically test backup, restoration, and recovery procedures and methods.
