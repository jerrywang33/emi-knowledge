heading: Backup policies and procedures, restoration and recovery procedures and methods
content_kind: editorial_summary
content: During recovery from an ICT-related incident, financial entities perform necessary checks, including multiple checks and reconciliations where needed, to maintain the highest level of data integrity, including when reconstructing data from external stakeholders and reconciling across systems.
