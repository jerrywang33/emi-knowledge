heading: Template for reporting ICT-related major incidents
content_kind: editorial_summary
content: Financial entities use Annex I for all three report stages, complete the fields required for each stage under Regulation (EU) 2025/301, ensure submitted information is complete and accurate, use estimates where possible when accurate initial or intermediate values are unavailable, resubmit all required and updated prior information with intermediate and final reports, and follow Annex II.
