heading: ICT operations security
content_kind: editorial_summary
content: For all ICT assets, a simplified-framework entity logs logical and physical access, ICT operations, system and network traffic, and ICT change events; monitors and analyses anomalous activity for critical or important ICT operations; monitors current cyber-threat information; and identifies information leakage, malicious code, other security threats, public vulnerabilities and corresponding updates. Log detail is aligned with its purpose and the producing asset's use.
