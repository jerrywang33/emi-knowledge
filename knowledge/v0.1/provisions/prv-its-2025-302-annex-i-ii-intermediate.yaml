heading: Content of the intermediate report
content_kind: editorial_summary
content: Intermediate fields cover occurrence and recovery timing, detailed classification impacts and thresholds, incident type and threat techniques, affected functions, processes, infrastructure and third parties, client financial-interest impact, notifications to other authorities, temporary recovery actions and applicable indicators of compromise, with conditional mandatory rules and field formats.
