heading: High materiality thresholds for determining significant cyber threats
content_kind: editorial_summary
content: A cyber threat is significant only when it could affect critical or important functions or specified external parties, has a high probability of materialisation based at least on relevant risks and exploitable vulnerabilities, known actor capability and intent, persistence and incident knowledge, and could meet the critical-services criterion, the clients-counterparts-transactions threshold or the geographical-spread threshold. Other materiality thresholds may also be considered when the threat type and available information support them.
