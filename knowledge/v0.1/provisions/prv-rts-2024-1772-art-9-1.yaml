heading: Materiality thresholds for determining major incidents
content_kind: editorial_summary
content: This threshold is met if affected clients exceed 10 percent of clients using the affected service or 100,000 clients; affected financial counterparts exceed 30 percent of relevant counterparts; affected transaction count or value exceeds 10 percent of the related daily average; or a client or counterpart identified as relevant under Article 1(3) is affected. Unavailable actual values are estimated from comparable reference periods.
