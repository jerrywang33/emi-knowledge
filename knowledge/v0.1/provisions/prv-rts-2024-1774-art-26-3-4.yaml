heading: ICT response and recovery plans
content_kind: editorial_summary
content: Full-framework response and recovery plans consider alternatives when primary recovery measures are not feasible in the short term because of cost, risk, logistics or unforeseen circumstances, and implement continuity measures for failures of third-party ICT services supporting critical or important functions.
