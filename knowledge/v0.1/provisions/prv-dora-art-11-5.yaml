heading: Response and recovery
content_kind: editorial_summary
content: Financial entities conduct a BIA of exposure to severe business disruptions using quantitative and qualitative criteria, internal and external data, and scenario analysis as appropriate; the BIA covers criticality, supporting processes, third-party dependencies, information assets and interdependencies, and drives alignment and redundancy of ICT assets and services.
