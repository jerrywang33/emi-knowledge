heading: Criticality of services affected
content_kind: editorial_summary
content: Critical services are affected when an incident affects ICT services or systems supporting critical or important functions, affects authorised, registered or supervised financial services, or constitutes successful malicious and unauthorised access to the entity's network and information systems.
