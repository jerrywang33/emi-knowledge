heading: Time limits for the initial notification, and for the intermediate and final reports
content_kind: editorial_summary
content: The intermediate report is submitted no later than 72 hours after the initial notification even without a status or handling change; an updated intermediate report is submitted without undue delay and in every case when regular activities recover.
