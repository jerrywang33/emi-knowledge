heading: Classification of ICT-related incidents and cyber threats
content_kind: editorial_summary
content: Financial entities classify cyber threats as significant based on criticality of services, transactions and operations at risk, the number or relevance of targeted clients or financial counterparts, and the geographical spread of areas at risk.
