heading: ICT-related incident management policy
content_kind: editorial_summary
content: The full-framework incident policy documents the DORA Article 17 process, lists relevant internal and external ICT operations security contacts for cyber-threat monitoring, anomaly detection and vulnerability management, and establishes technical, organisational and operational mechanisms that support the process and prompt anomaly detection.
