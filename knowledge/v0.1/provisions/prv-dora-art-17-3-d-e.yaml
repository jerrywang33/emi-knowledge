heading: ICT-related incident management process
content_kind: editorial_summary
content: The incident management process covers staff, stakeholder and media communication, client notification, internal escalation including customer complaints, and counterpart information as appropriate; at least major incidents are reported to senior management and explained to the management body with their impact, response and additional controls.
