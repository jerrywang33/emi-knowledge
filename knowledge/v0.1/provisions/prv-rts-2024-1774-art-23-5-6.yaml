heading: Anomalous activities detection and criteria for ICT-related incidents detection and response
content_kind: editorial_summary
content: Full-framework entities consider indications of malicious activity or compromise, losses of data availability, authenticity, integrity or confidentiality, adverse transaction or operational impact, ICT system or network unavailability, and the criticality of affected services when triggering incident detection and response processes.
