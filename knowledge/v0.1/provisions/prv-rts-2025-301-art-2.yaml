heading: Specific information to be provided in initial notifications
content_kind: editorial_summary
content: An initial notification provides at least the institution's incident reference, detection and classification timestamps, incident description, major-classification criteria, impacted Member States, discovery method, available origin information, business continuity plan activation, applicable major-to-non-major reclassification information and any other available relevant information.
