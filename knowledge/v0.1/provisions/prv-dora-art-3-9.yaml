heading: Definitions
content_kind: editorial_summary
content: An operational or security payment-related incident is an unplanned single event or series of linked events, whether ICT-related or not, that adversely affects payment-related data availability, authenticity, integrity or confidentiality, or payment-related services provided by an entity listed in Article 2(1)(a) to (d).
