heading: Reputational impact
content_kind: editorial_summary
content: Reputational impact exists when the incident is reflected in media, generates repetitive complaints from different clients or counterparts, causes or is likely to cause regulatory non-compliance, or causes or is likely to cause a material loss of clients or counterparts; the entity also considers actual or likely visibility for each condition.
