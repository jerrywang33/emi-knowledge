heading: Provisions on the estimation of aggregated annual costs and losses of major ICT-related incidents
content_kind: editorial_summary
content: Financial entities estimate each included major incident separately to obtain gross costs and losses using the Regulation (EU) 2024/1772 Article 7 cost types, estimate financial recoveries using the Regulation (EU) 2025/302 Annex II specification, and aggregate gross costs and losses and recoveries across those incidents.
