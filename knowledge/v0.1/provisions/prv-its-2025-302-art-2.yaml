heading: Joint submission of initial notification, intermediate and final reports
content_kind: editorial_summary
content: A financial entity may submit two or all three reporting stages together when regular activities have recovered or root-cause analysis is complete and every applicable Regulation (EU) 2025/301 Article 5 deadline is met.
