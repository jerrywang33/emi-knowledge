heading: Economic impact
content_kind: editorial_summary
content: Economic impact sums incident-caused direct and indirect costs and losses without financial recoveries, including liable stolen assets, replacement or relocation, staff, contractual fees, customer redress, forgone revenue, communication and advisory costs. Day-to-day operation, post-incident business enhancement and insurance premium costs are excluded; available actual values or estimates are used at reporting time.
