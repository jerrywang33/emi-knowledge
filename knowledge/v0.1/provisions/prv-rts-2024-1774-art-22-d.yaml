heading: ICT-related incident management policy
content_kind: editorial_summary
content: The full-framework incident policy requires secure retention of all ICT-related incident evidence for no longer than necessary for its collection purpose, proportionate to the criticality of affected business functions, supporting processes and ICT and information assets, consistent with Regulation (EU) 2024/1772 Article 8(2) and applicable Union-law retention requirements.
