heading: Response and recovery
content_kind: editorial_summary
content: Financial entities other than microenterprises maintain a crisis management function with clear internal and external communication procedures when continuity or recovery plans are activated, and all financial entities keep readily accessible records of activities before and during disruption events involving plan activation.
