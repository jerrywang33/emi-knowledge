content: The MFSA process restates the initial-notification four-hour and 24-hour limits, the intermediate-report 72-hour limit and recovery update, and the final-report one-month limit, and directs Authorised Persons to Regulation (EU) 2025/301 Article 5 for the governing time-limit details.
