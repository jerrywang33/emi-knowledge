heading: Classification of ICT-related incidents and cyber threats
content_kind: editorial_summary
content: Financial entities classify ICT-related incidents and determine their impact using affected clients, financial counterparts and transactions plus reputational impact; duration and downtime; geographical spread; data availability, authenticity, integrity and confidentiality losses; affected-service criticality; and direct and indirect economic impact.
