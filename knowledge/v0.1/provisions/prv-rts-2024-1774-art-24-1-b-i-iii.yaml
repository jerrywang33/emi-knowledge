heading: Components of the ICT business continuity policy
content_kind: editorial_summary
content: Full-framework continuity policies establish governance, roles, responsibilities, escalation and sufficient resources; align ICT and overall business continuity plans on failure scenarios and recovery objectives including RTO and RPO; and provide severe-disruption plans with risk-based prioritisation of continuity actions.
