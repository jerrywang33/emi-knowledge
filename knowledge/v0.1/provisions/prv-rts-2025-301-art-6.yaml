heading: Content of the voluntary notification of significant cyber threats
content_kind: editorial_summary
content: A voluntary significant-cyber-threat notification contains notifying-entity information, detection and other relevant timestamps, threat description and potential impact, classification criteria that would trigger a major report if materialised, threat status and changes, applicable prevention actions and indicators of compromise, notifications to other entities or authorities, and other available relevant information.
