heading: Components of the ICT business continuity policy
content_kind: editorial_summary
content: Full-framework entities include in the ICT business continuity policy its objectives and relationship with overall business continuity using BIA results, the scope and any limits or exclusions of continuity arrangements, the covered timeframe, and criteria for activating and deactivating continuity, response and recovery, and crisis communication plans.
