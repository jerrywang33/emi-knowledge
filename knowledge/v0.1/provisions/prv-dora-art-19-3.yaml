heading: Reporting of major ICT-related incidents and voluntary notification of significant cyber threats
content_kind: editorial_summary
content: When a major ICT-related incident impacts clients' financial interests, the entity informs them without undue delay after becoming aware of it and explains mitigation measures; where applicable for a significant cyber threat, the entity informs potentially affected clients of appropriate protection measures they may take.
