heading: Operational or security payment-related incidents concerning specified financial entities
content_kind: editorial_summary
content: DORA Chapter III requirements also apply to operational or security payment-related incidents and major operational or security payment-related incidents concerning electronic money institutions, including incidents that are not ICT-related under Article 3(9).
