content_kind: editorial_summary
content: General and initial fields cover submission and entity identity, affected and aggregated entities, authority contacts, parent and currency information, entity and authority incident references, detection and major-classification timestamps, description, criteria and thresholds, impacted EEA states, discovery and origin, continuity-plan activation, reclassification and other relevant information, with stage-specific mandatory conditions and field formats.
