heading: Materiality thresholds for determining major incidents
content_kind: editorial_summary
content: The data-loss threshold is met when availability, authenticity, integrity or confidentiality impact has or will adversely affect business objectives or regulatory compliance, or when successful malicious and unauthorised access to network and information systems outside that condition may result in data loss.
