heading: Backup policies and procedures, restoration and recovery procedures and methods
content_kind: editorial_summary
content: To restore ICT systems and data with minimum downtime, disruption, and loss, financial entities document backup policies and procedures defining data scope and minimum frequency based on information criticality or data confidentiality, together with restoration and recovery procedures and methods.
