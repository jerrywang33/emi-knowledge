heading: Reclassification of major ICT-related incidents
content_kind: editorial_summary
content: If further assessment shows that a reported major ICT-related incident never met the applicable criteria and thresholds, the financial entity notifies the competent authority of reclassification to non-major using the Annex II instructions for the report-type and other-information fields.
