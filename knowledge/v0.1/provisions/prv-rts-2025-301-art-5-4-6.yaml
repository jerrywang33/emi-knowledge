heading: Time limits for the initial notification, and for the intermediate and final reports
content_kind: editorial_summary
content: A deadline falling on a weekend or bank holiday in the reporting entity's Member State may move to noon on the next working day. This extension does not apply to initial or intermediate reports by listed entities or financial entities identified as NIS2 essential or important, and a competent authority may prospectively remove it for other significant or systemically important financial entities after notification.
