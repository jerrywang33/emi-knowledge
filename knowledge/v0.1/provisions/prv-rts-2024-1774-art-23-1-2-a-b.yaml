heading: Anomalous activities detection and criteria for ICT-related incidents detection and response
content_kind: editorial_summary
content: Full-framework entities assign clear detection and response roles; collect, monitor and analyse internal and external factors, logs, business and ICT information, user reports, cyber threats and relevant third-party provider incident notifications; and use alerting tools to detect anomalous activity at least for assets supporting critical or important functions.
