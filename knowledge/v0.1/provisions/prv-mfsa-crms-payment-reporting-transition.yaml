heading: Major ICT-Related Incidents
content_kind: editorial_summary
content: For entities in DORA Article 2(1)(a)-(d), including electronic money institutions and exempted electronic money institutions, the prior PSD2 incident-reporting obligation ceases and DORA provides the reporting mechanism for operational or security payment-related incidents irrespective of their ICT nature.
