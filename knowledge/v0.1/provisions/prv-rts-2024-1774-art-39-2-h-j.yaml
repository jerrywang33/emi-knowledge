heading: Components of the ICT business continuity plan
content_kind: editorial_summary
content: Simplified-framework continuity plans include alternative options when short-term recovery may not be feasible, internal and external communication and escalation arrangements, and updates driven by incident and test lessons, new risks and threats, changed recovery objectives, and major organisational or supporting-asset changes.
