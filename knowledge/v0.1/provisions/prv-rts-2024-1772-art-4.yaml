heading: Geographical spread
content_kind: editorial_summary
content: Geographical spread considers actual or past impact in other Member States and its significance for clients and financial counterparts, branches or group financial entities, and, where information is available, financial market infrastructures or third-party providers that may affect financial entities they serve in other Member States.
