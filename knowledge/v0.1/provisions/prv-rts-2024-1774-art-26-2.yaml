heading: ICT response and recovery plans
content_kind: editorial_summary
content: Full-framework response and recovery plans use current threat information and disruption lessons to cover relevant severe or increasingly likely scenarios, including cyber-attack and switchover, unacceptable degradation or failure of critical or important functions and relevant providers, premises or data-centre failure, ICT asset or communication failure, critical staff unavailability, climate and environmental events, natural disasters, pandemics, physical or terrorist attacks, insider attacks, political or social instability affecting providers or data locations, and widespread power outages.
