heading: Clients, financial counterparts and transactions
content_kind: editorial_summary
content: Affected-client counts include users unable to use or adversely affected by the service and contractually covered third-party beneficiaries; affected-counterpart counts cover contractual financial counterparts; relevance considers business objectives and market efficiency; transaction counts and values include monetary transactions with at least one Union leg. Unavailable actual values are estimated from comparable reference periods.
