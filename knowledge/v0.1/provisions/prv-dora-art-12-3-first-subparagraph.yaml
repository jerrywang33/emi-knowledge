heading: Backup policies and procedures, restoration and recovery procedures and methods
content_kind: editorial_summary
content: When restoring backup data using their own systems, financial entities use systems physically and logically segregated from the source, protect them from unauthorised access and ICT corruption, and enable timely restoration of services from data and system backups.
