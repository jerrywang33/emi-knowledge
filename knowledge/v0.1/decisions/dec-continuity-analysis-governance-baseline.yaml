  - prv-rts-2024-1774-art-39-1
  - prv-rts-2024-1774-art-39-2-a-c
assumptions:
  - The institution supplies current business, asset, dependency and legal-status facts before applying this engineering pattern.
conditions:
  - The applicable full or simplified DORA framework branch is confirmed from institution evidence by an authorised role.
  - BIA conclusions, proportionality choices, microenterprise status, approval roles, resources and audit arrangements remain institution decisions.
