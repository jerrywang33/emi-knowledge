  - prv-jc-gl-2024-34-paragraphs-8-9
  - prv-jc-gl-2024-34-paragraphs-10-11
  - prv-jc-gl-2024-34-annex
assumptions:
  - Final incident reports and finance or supervisory records can be reconciled through stable incident references.
conditions:
  - The workflow applies only after a competent-authority request to an applicable non-microenterprise EMI using the full framework.
  - The institution approves its reference-year basis, financial data sources, authority route, roles, and retention.
