decision_type: implementation_choice
subject_requirement_ids: []
subject_control_ids:
  - ctl-annual-incident-cost-loss
question: Which reusable engineering pattern should prepare an authority-requested annual major-incident cost and loss estimate?
conclusion: Gate the workflow on request and applicability, use one approved completed reference-year basis, reconcile the full incident population, calculate gross amounts and recoveries separately, and preserve source-level and per-incident traceability.
rationale: This pattern converts the Joint Guidelines sequence into deterministic population, calculation, reconciliation, and report checks while leaving institution financial systems and the selected reference-year basis configurable.
basis_provision_ids:
