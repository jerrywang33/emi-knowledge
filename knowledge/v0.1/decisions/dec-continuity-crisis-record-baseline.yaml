id: dec-continuity-crisis-record-baseline
type: decision
schema_version: 0.1.0
revision: 1
title: Engineering baseline for continuity activation, communication, and records
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
decision_type: implementation_choice
subject_requirement_ids: []
subject_control_ids:
  - ctl-continuity-activation-communication
question: Which reusable engineering pattern should govern continuity-plan activation, crisis coordination, communication and disruption records?
conclusion: Use explicit trigger evidence, authorised activation and deactivation decisions, named crisis and alternate roles, verified facts, controlled message approval and delivery outcomes, and one protected chronology from pre-activation assessment through follow-up.
rationale: This pattern makes decisions and communication traceable while leaving trigger thresholds, declaration authority, recipients, channels, internal times and retention periods to the institution and preventing an Agent from approving its own operational conclusion.
basis_provision_ids:
  - prv-dora-art-11-6-a-b
  - prv-dora-art-11-7-8
  - prv-dora-art-14-1-3
  - prv-rts-2024-1774-art-24-1-a
  - prv-rts-2024-1774-art-39-2-h-j
assumptions:
  - The institution maps generic crisis and communication roles to authorised people or functions and maintains available contact paths.
conditions:
  - Disaster declaration, plan activation, external messaging, degraded operation, recovery acceptance and record retention require institution-defined authority and evidence.
