  - ctl-post-incident-review-learning
  - ctl-incident-trend-management-reporting
question: Which reusable engineering pattern should support classification, recurring analysis, post-incident review, and management learning?
conclusion: Use versioned criteria assessments, immutable reassessment history, evidence-linked root-cause and effectiveness reviews, monthly recurring-incident grouping, and at least annual management-body reporting.
rationale: The pattern keeps legal thresholds distinct from internal severity measures and creates reproducible links from incident facts to classification, improvements, risks, and governance decisions.
basis_provision_ids:
  - prv-dora-art-18-1
  - prv-dora-art-18-2
  - prv-rts-2024-1772-art-8-1
  - prv-rts-2024-1772-art-8-2
  - prv-dora-art-13-2
  - prv-dora-art-13-3-5
  - prv-dora-art-6-5
assumptions:
  - Current legal criteria and thresholds are available to the institution's classification process in a controlled form.
conditions:
  - Internal severity labels may support operations but cannot replace DORA classification criteria or materiality thresholds.
  - Review ownership, completion targets, systems, and evidence retention require institution approval.
