question: Which reusable engineering pattern should govern recovery objectives, plans, capacity, backup, restoration, integrity and recovery acceptance?
conclusion: Use approved per-function recovery targets, target-to-capability traceability, versioned executable plans, authorised activation and recovery gates, protected and separated backups, tested restoration paths, and explicit functionality, security, integrity, reconciliation and residual-risk checks before recovery acceptance.
rationale: This pattern connects BIA outputs to executable recovery and evidence without inventing universal RTO, RPO, backup frequency, capacity, reconciliation tolerance, degraded-operation limit or acceptance authority.
