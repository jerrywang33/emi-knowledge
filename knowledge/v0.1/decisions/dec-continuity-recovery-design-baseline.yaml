  - prv-rts-2024-1774-art-39-2-d-g
  - prv-rts-2024-1774-art-39-2-h-j
assumptions:
  - The institution can map functions and recovery objectives to owned or third-party systems, services, data and operational dependencies.
conditions:
  - Institution-specific recovery values, architecture, backup settings, activation authority, acceptance criteria and risk disposition require authorised approval and real evidence.
  - An Agent may execute permitted checks and collect evidence but cannot declare a disaster, approve residual risk or accept recovery.
