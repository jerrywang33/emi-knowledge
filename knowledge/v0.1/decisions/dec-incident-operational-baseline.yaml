  - prv-rts-2024-1774-art-22-d
  - prv-rts-2024-1774-art-23-1-2-a-b
assumptions:
  - An institution maps the generic owner roles and process interfaces to authorised functions before operational use.
conditions:
  - Statutory scope and conditions remain governed by the referenced Requirements and Provisions.
  - Internal targets, systems, channels, access rules, and retention schedules require institution approval.
