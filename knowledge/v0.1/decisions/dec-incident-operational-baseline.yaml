question: Which reusable engineering pattern should govern incident intake, monitoring, response, recovery, records, and communications?
conclusion: Use one stable incident case, explicit scope and role routing, protected chronology, monitored trigger inputs, controlled response and secure-restoration gates, and traceable communication outcomes.
rationale: This pattern connects event detection to action and evidence while preserving institution-specific systems, roles, alert thresholds, internal targets, communication channels, and retention schedules as configuration.
