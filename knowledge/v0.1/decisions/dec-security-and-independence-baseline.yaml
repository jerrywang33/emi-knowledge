  - ctl-change-role-separation
  - ctl-change-security-impact
question: Which reusable control pattern should the public engineering baseline use for security verification, role independence, and change risk assessment?
conclusion: Use traceable requirement-to-test mapping, risk-based test depth, deterministic identity comparison for conflicting roles, and a recorded security-control impact assessment.
rationale: These controls create repeatable pass and fail conditions and preserve institution-level choices for test depth, major-change criteria, and system mapping.
