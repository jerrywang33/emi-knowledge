  - prv-rts-2024-1774-art-40-2-3
assumptions:
  - Tests use controlled data and environments and preserve any required third-party and production safeguards.
conditions:
  - Scenario selection, test depth, participants, safety limits, internal remediation deadlines and closure authority remain institution-defined.
  - A passed test is evidence for the tested scope and time and does not prove future production recovery or institution compliance.
