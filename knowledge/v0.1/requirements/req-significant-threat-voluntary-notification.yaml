id: req-significant-threat-voluntary-notification
type: requirement
schema_version: 0.1.0
revision: 1
title: Voluntarily notify a relevant significant cyber threat
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution may voluntarily notify its relevant competent authority of a significant cyber threat when it considers the threat relevant to the financial system, service users or clients.
requirement_kind: permission
derivation_type: direct
provision_refs:
  - {provision_id: prv-dora-art-19-2, relation: direct_basis}
  - {provision_id: prv-dora-art-3-12, relation: definition_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: all, values: []}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: all, values: []}
  framework_branches: {mode: all, values: []}
  effective_from: "2025-01-17"
  effective_to: null
  conditions:
    - The cyber threat has been classified as significant.
    - The institution considers the threat relevant to the financial system, service users or clients.
  exclusions:
    - Classification as significant does not make regulatory notification mandatory.
