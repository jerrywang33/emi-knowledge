statement: At every major-incident reporting stage, an electronic money institution shall use the prescribed template and instructions and provide complete and accurate general information identifying the submission, affected institution, submitting entity, any entities covered by an aggregated report, authority contacts, applicable parent undertaking and reporting currency.
