id: req-full-incident-detection-and-monitoring
type: requirement
schema_version: 0.1.0
revision: 1
title: Detect anomalies and incidents from relevant monitoring inputs
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution using the full ICT risk management framework shall assign clear detection and response roles and operate regularly tested mechanisms with sufficient resources that promptly detect anomalies, network performance issues, ICT-related incidents and potential material single points of failure by monitoring relevant logs, business and ICT information, user reports, cyber threats and third-party provider incident notifications, with alerting tools covering at least assets supporting critical or important functions.
requirement_kind: obligation
derivation_type: combined
provision_refs:
  - {provision_id: prv-dora-art-10-1, relation: direct_basis}
  - {provision_id: prv-dora-art-10-3, relation: direct_basis}
  - {provision_id: prv-rts-2024-1774-art-23-1-2-a-b, relation: direct_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-16-1-simplified-entities, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: include, values: [emi_without_emd2_article_9_1_exemption]}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: not_applicable, values: []}
