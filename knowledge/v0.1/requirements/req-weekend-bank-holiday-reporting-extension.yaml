id: req-weekend-bank-holiday-reporting-extension
type: requirement
schema_version: 0.1.0
revision: 1
title: Apply the conditional weekend and bank-holiday extension
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: When a major-incident reporting deadline falls on a weekend or bank holiday in its Member State, an electronic money institution may submit by noon on the next working day, subject to the prescribed exclusions for initial and intermediate reports and any prospective competent-authority decision notified to the institution.
requirement_kind: permission
derivation_type: direct
provision_refs:
  - {provision_id: prv-rts-2025-301-art-5-4-6, relation: direct_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: all, values: []}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: all, values: []}
  framework_branches: {mode: all, values: []}
  effective_from: "2025-03-12"
  effective_to: null
  conditions:
    - The applicable deadline falls on a weekend or bank holiday in the reporting institution's Member State.
  exclusions:
    - The extension does not apply to an initial notification or intermediate report by an institution identified as an essential or important entity under Directive (EU) 2022/2555.
    - The extension does not apply to an initial notification or intermediate report where the competent authority has prospectively removed it for the institution and notified that decision.
