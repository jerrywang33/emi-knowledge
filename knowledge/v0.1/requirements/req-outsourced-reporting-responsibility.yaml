id: req-outsourced-reporting-responsibility
type: requirement
schema_version: 0.1.0
revision: 1
title: Retain responsibility for outsourced reporting and incident handling
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution may outsource incident reporting in accordance with applicable Union and national sectoral law, and shall remain fully responsible for meeting its reporting requirements and for handling the incident and its consequences, including after supervisory feedback.
requirement_kind: obligation
derivation_type: combined
provision_refs:
  - {provision_id: prv-dora-art-19-5, relation: direct_basis}
  - {provision_id: prv-dora-art-22-1-responsibility, relation: direct_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: all, values: []}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: all, values: []}
  framework_branches: {mode: all, values: []}
  effective_from: "2025-01-17"
  effective_to: null
  conditions:
    - Incident reporting is outsourced or supervisory feedback has been received.
  exclusions:
    - Outsourcing or supervisory feedback does not transfer the institution's responsibility.
