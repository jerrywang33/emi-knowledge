id: req-full-continuity-test-remediation
type: requirement
schema_version: 0.1.0
revision: 2
title: Review continuity arrangements and remediate test deficiencies
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution using the full ICT risk management framework shall document continuity-test results, analyse and address identified deficiencies, report them to the management body, and regularly review its ICT business continuity policy and response and recovery plans using test, audit and supervisory findings; it shall continuously incorporate lessons from real incidents and continuity or recovery challenges into ICT risk assessment and relevant framework reviews and report resulting findings and recommendations to the management body at least annually.
requirement_kind: obligation
derivation_type: combined
provision_refs:
  - {provision_id: prv-dora-art-11-6-scenarios-review, relation: direct_basis}
  - {provision_id: prv-rts-2024-1774-art-25-5, relation: direct_basis}
  - {provision_id: prv-dora-art-13-3-5, relation: direct_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-16-1-simplified-entities, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: include, values: [emi_without_emd2_article_9_1_exemption]}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: not_applicable, values: []}
  framework_branches: {mode: include, values: [dora_full_ict_risk_management]}
  effective_from: "2025-01-17"
  effective_to: null
  conditions: []
  exclusions:
    - Deficiency severity, remediation ownership and closure deadlines are institution-defined unless another applicable source sets them.
    - Electronic money institutions exempted pursuant to Directive 2009/110/EC use the simplified ICT risk management branch.
