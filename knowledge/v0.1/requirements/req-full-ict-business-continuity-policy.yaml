id: req-full-ict-business-continuity-policy
type: requirement
schema_version: 0.1.0
revision: 1
title: Maintain a governed ICT business continuity policy
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution using the full ICT risk management framework shall maintain a comprehensive ICT business continuity policy integrated with overall business continuity and informed by the BIA; the policy shall define objectives, scope, limitations, timeframe, plan activation and deactivation criteria, governance, roles, escalation, resources, recovery objectives, severe-disruption planning, risk-based priorities, response and recovery plan lifecycle, effectiveness review and communication alignment.
requirement_kind: obligation
derivation_type: combined
provision_refs:
  - {provision_id: prv-dora-art-11-1, relation: direct_basis}
  - {provision_id: prv-rts-2024-1774-art-24-1-a, relation: direct_basis}
  - {provision_id: prv-rts-2024-1774-art-24-1-b-i-iii, relation: direct_basis}
  - {provision_id: prv-rts-2024-1774-art-24-1-b-iv-vi, relation: direct_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-16-1-simplified-entities, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
  - {provision_id: prv-mfsa-dora-authorisation-continuity-findings, relation: supporting_context}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: include, values: [emi_without_emd2_article_9_1_exemption]}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: not_applicable, values: []}
  framework_branches: {mode: include, values: [dora_full_ict_risk_management]}
  effective_from: "2025-01-17"
  effective_to: null
  conditions: []
  exclusions:
