id: req-major-incident-secure-submission
type: requirement
schema_version: 0.1.0
revision: 1
title: Use the competent authority's secure reporting channel
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution shall submit major-incident notifications and reports through the competent authority's secure electronic channel; if it cannot use that channel, it shall inform the authority through another secure means agreed with the authority and, when required, resubmit through the authority channel once available.
requirement_kind: obligation
derivation_type: direct
