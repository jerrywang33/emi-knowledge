id: req-major-ict-incident-regulatory-reporting
type: requirement
schema_version: 0.1.0
revision: 1
title: Report every major ICT-related incident
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution shall report every ICT-related incident classified as major to its relevant competent authority, submit the prescribed initial notification and reports with information sufficient to assess significance and possible cross-border impact, and use alternative notification means when technical impossibility prevents submission of the initial-notification template.
requirement_kind: obligation
derivation_type: direct
provision_refs:
  - {provision_id: prv-dora-art-19-1, relation: direct_basis}
  - {provision_id: prv-dora-art-3-10, relation: definition_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: all, values: []}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: all, values: []}
  framework_branches: {mode: all, values: []}
  effective_from: "2025-01-17"
  effective_to: null
  conditions:
    - The ICT-related incident has been classified as major under the applicable criteria and thresholds.
