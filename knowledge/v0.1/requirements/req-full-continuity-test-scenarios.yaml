id: req-full-continuity-test-scenarios
type: requirement
schema_version: 0.1.0
revision: 1
title: Test severe disruption scenarios and recovery capability
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution using the full ICT risk management framework shall base continuity testing on its BIA and ICT risk assessment, use severe but plausible scenarios reflected in its plans, cover applicable third-party ICT services, challenge plan and communication assumptions, and verify the response ability of people, providers, systems and services; its scenarios shall address relevant cyber, infrastructure, function, provider, premises, communications, staffing, environmental, physical, insider, geopolitical and power disruptions, with the source-defined switchover test condition applied to entities other than microenterprises.
requirement_kind: obligation
derivation_type: combined
provision_refs:
  - {provision_id: prv-dora-art-11-6-scenarios-review, relation: direct_basis}
  - {provision_id: prv-rts-2024-1774-art-25-1, relation: direct_basis}
  - {provision_id: prv-rts-2024-1774-art-25-2, relation: direct_basis}
  - {provision_id: prv-rts-2024-1774-art-26-2, relation: direct_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-16-1-simplified-entities, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
  - {provision_id: prv-mfsa-dora-authorisation-rts-continuity-findings, relation: supporting_context}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: include, values: [emi_without_emd2_article_9_1_exemption]}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: not_applicable, values: []}
  framework_branches: {mode: include, values: [dora_full_ict_risk_management]}
  effective_from: "2025-01-17"
  effective_to: null
  conditions:
    - Applicability and plausibility of individual scenarios are assessed against current threats, dependencies and institution facts.
    - The specific DORA Article 11(6) switchover testing condition applies to entities other than microenterprises.
  exclusions:
    - The source-defined scenario catalogue does not establish one universal test script or acceptance threshold.
    - Electronic money institutions exempted pursuant to Directive 2009/110/EC use the simplified ICT risk management branch.
