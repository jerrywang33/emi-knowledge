id: req-recurring-incident-monthly-assessment
type: requirement
schema_version: 0.1.0
revision: 1
title: Assess recurring non-major incidents collectively each month
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: Each month, a non-microenterprise electronic money institution using the full ICT risk management framework shall determine whether incidents that were individually non-major occurred at least twice within six months, share the same apparent root cause and collectively meet the major-incident rule, in which case it shall treat them as one major incident.
requirement_kind: obligation
derivation_type: direct
provision_refs:
  - {provision_id: prv-rts-2024-1772-art-8-2, relation: direct_basis}
  - {provision_id: prv-dora-art-3-10, relation: definition_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-16-1-simplified-entities, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: include, values: [emi_without_emd2_article_9_1_exemption]}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: not_applicable, values: []}
  framework_branches: {mode: include, values: [dora_full_ict_risk_management]}
  effective_from: "2025-01-17"
  effective_to: null
  conditions: []
  exclusions:
    - Microenterprises.
    - Electronic money institutions exempted pursuant to Directive 2009/110/EC.
