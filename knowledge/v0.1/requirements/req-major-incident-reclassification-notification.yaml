id: req-major-incident-reclassification-notification
type: requirement
schema_version: 0.1.0
revision: 1
title: Notify the authority of a major-to-non-major reclassification
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: If further assessment concludes that a previously reported ICT-related incident never met the major-incident criteria and thresholds, an electronic money institution shall notify the competent authority that it has reclassified the incident as non-major using the prescribed report-type and other-information fields.
requirement_kind: obligation
derivation_type: direct
provision_refs:
  - {provision_id: prv-its-2025-302-art-5, relation: direct_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: all, values: []}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: all, values: []}
  framework_branches: {mode: all, values: []}
  effective_from: "2025-03-12"
  effective_to: null
  conditions:
    - The incident was reported as major.
    - Further assessment establishes that it never met the applicable major-incident criteria and thresholds.
  exclusions: []
