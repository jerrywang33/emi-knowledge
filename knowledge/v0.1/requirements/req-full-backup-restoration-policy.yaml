id: req-full-backup-restoration-policy
type: requirement
schema_version: 0.1.0
revision: 1
title: Maintain backup, restoration, and recovery policies and procedures
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution using the full ICT risk management framework shall document backup policies and procedures that define the data scope and minimum backup frequency according to information criticality or data confidentiality, together with restoration and recovery procedures and methods designed to restore ICT systems and data with minimum downtime, disruption and loss.
requirement_kind: obligation
derivation_type: direct
provision_refs:
  - {provision_id: prv-dora-art-12-1, relation: direct_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-16-1-simplified-entities, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
  - {provision_id: prv-mfsa-dora-authorisation-rts-continuity-findings, relation: supporting_context}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: include, values: [emi_without_emd2_article_9_1_exemption]}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: all, values: []}
  framework_branches: {mode: include, values: [dora_full_ict_risk_management]}
  effective_from: "2025-01-17"
  effective_to: null
  conditions: []
  exclusions:
    - The cited provision does not prescribe one universal backup frequency for every data set.
    - The institution defines backup frequencies from documented criticality and confidentiality.
    - Electronic money institutions exempted pursuant to Directive 2009/110/EC use the simplified ICT risk management branch.
