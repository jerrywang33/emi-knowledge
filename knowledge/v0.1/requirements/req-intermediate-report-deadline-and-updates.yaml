id: req-intermediate-report-deadline-and-updates
type: requirement
schema_version: 0.1.0
revision: 1
title: Submit and update the intermediate report on time
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution shall submit an intermediate report no later than 72 hours after the initial notification even if incident status or handling has not changed, and shall submit an updated intermediate report without undue delay after prescribed changes or requests and in every case when regular activities have recovered.
requirement_kind: deadline
derivation_type: combined
