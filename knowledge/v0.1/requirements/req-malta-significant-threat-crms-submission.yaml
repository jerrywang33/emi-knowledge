id: req-malta-significant-threat-crms-submission
type: requirement
schema_version: 0.1.0
revision: 1
title: Submit a chosen Malta significant-threat notification through CRMS
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: When an MFSA Authorised Person that is an electronic money institution chooses to notify a significant cyber threat, it shall submit the notification to the MFSA through CRMS within the Licence Holder Portal using the provided template.
requirement_kind: obligation
derivation_type: combined
provision_refs:
  - {provision_id: prv-mfsa-crms-dora-reporting-channel, relation: direct_basis}
  - {provision_id: prv-mfsa-threat-process-voluntary-scope, relation: direct_basis}
  - {provision_id: prv-dora-art-19-2, relation: supporting_context}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [MT]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: all, values: []}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: all, values: []}
  framework_branches: {mode: all, values: []}
  effective_from: "2025-01-17"
  effective_to: null
  conditions:
    - The institution is an MFSA Authorised Person.
    - The cyber threat has been classified as significant.
    - The institution has chosen to make the voluntary notification.
  exclusions:
    - MFSA encouragement does not change the voluntary nature of the notification decision.
