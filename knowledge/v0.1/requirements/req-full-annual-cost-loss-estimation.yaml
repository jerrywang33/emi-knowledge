id: req-full-annual-cost-loss-estimation
type: requirement
schema_version: 0.1.0
revision: 1
title: Estimate and aggregate gross amounts and recoveries sequentially
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: For each included major incident, an electronic money institution should estimate gross costs and losses using the prescribed cost types, estimate financial recoveries separately, and then aggregate gross costs and losses and recoveries across all included incidents.
requirement_kind: obligation
derivation_type: combined
provision_refs:
  - {provision_id: prv-jc-gl-2024-34-paragraph-7, relation: direct_basis}
  - {provision_id: prv-rts-2024-1772-art-7, relation: direct_basis}
  - {provision_id: prv-its-2025-302-annex-i-ii-final, relation: direct_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-16-1-simplified-entities, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: include, values: [emi_without_emd2_article_9_1_exemption]}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: not_applicable, values: []}
  framework_branches: {mode: include, values: [dora_full_ict_risk_management]}
  effective_from: "2025-05-19"
  effective_to: null
  conditions:
    - The incident belongs to the requested reference-year population.
  exclusions:
    - Microenterprises and electronic money institutions using the simplified ICT risk management branch.
