id: req-incident-classification-assessment
type: requirement
schema_version: 0.1.0
revision: 1
title: Assess every prescribed ICT incident classification criterion
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution shall classify each ICT-related incident and determine its impact by applying the prescribed calculation methods for affected clients, financial counterparts and transactions, reputational impact, duration and service downtime, geographical spread, data losses, affected-service criticality and economic impact, using permitted estimates where actual values cannot yet be determined.
