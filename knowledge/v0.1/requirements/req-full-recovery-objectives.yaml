id: req-full-recovery-objectives
type: requirement
schema_version: 0.1.0
revision: 1
title: Set and govern recovery time and recovery point objectives
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution using the full ICT risk management framework shall determine recovery time and recovery point objectives for each function according to its criticality and potential market impact, align ICT and overall business continuity plans to those objectives, and set objectives that preserve agreed service levels under extreme scenarios.
requirement_kind: obligation
derivation_type: combined
provision_refs:
  - {provision_id: prv-dora-art-12-6, relation: direct_basis}
  - {provision_id: prv-rts-2024-1774-art-24-1-b-i-iii, relation: direct_basis}
  - {provision_id: prv-dora-art-3-22, relation: definition_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-16-1-simplified-entities, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
  - {provision_id: prv-mfsa-dora-authorisation-rts-continuity-findings, relation: supporting_context}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: include, values: [emi_without_emd2_article_9_1_exemption]}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: not_applicable, values: []}
  framework_branches: {mode: include, values: [dora_full_ict_risk_management]}
  effective_from: "2025-01-17"
  effective_to: null
  conditions: []
  exclusions:
    - The cited provisions do not prescribe a universal EMI RTO or RPO value.
    - Recovery values and service levels require institution evidence and authorised approval.
    - Electronic money institutions exempted pursuant to Directive 2009/110/EC use the simplified ICT risk management branch.
