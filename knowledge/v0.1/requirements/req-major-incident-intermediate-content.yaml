statement: In an intermediate report, an electronic money institution shall provide the prescribed occurrence and recovery times, classification impacts and thresholds, incident type and applicable threat techniques, affected functions, processes, infrastructure and third parties, client financial-interest impact, other authority notifications, temporary recovery actions and applicable indicators of compromise, following the template's field conditions and formats.
