id: req-full-secure-segregated-backup-restoration
type: requirement
schema_version: 0.1.0
revision: 1
title: Secure, segregate, activate, and test backup restoration
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution using the full ICT risk management framework shall maintain backup systems that can be activated under approved procedures without compromising network, system or data security; it shall periodically test backup, restoration and recovery procedures and, when restoring through its own systems, use physically and logically segregated systems protected from unauthorised access and ICT corruption that enable timely restoration.
requirement_kind: obligation
derivation_type: combined
