id: req-full-continuity-function-dependency-inventory
type: requirement
schema_version: 0.1.0
revision: 1
title: Maintain the continuity function, asset, and dependency inventory
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution using the full ICT risk management framework shall identify, classify and document ICT-supported business functions, their roles, information and ICT assets, configurations, interdependencies and relevant ICT third-party dependencies; it shall map critical assets and keep the classification and inventories current, including at least annual review and updates following major changes.
requirement_kind: obligation
derivation_type: combined
