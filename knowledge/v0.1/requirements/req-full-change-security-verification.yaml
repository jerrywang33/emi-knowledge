id: req-full-change-security-verification
type: requirement
schema_version: 0.1.0
revision: 1
title: Verify ICT security requirements for every change
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution using the full ICT risk management framework shall include verification that ICT security requirements have been met for every change to software, hardware, firmware components, systems, or security parameters.
requirement_kind: obligation
derivation_type: direct
provision_refs:
