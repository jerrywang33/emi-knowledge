id: req-major-incident-report-sequence
type: requirement
schema_version: 0.1.0
revision: 1
title: Maintain the major-incident report sequence
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: For a reportable major ICT-related incident, an electronic money institution shall submit an initial notification, an intermediate report and further updates when prescribed, and a final report after root-cause analysis is complete and actual impact figures are available to replace estimates, regardless of whether mitigation measures have been fully implemented.
