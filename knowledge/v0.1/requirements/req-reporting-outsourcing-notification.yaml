id: req-reporting-outsourcing-notification
type: requirement
schema_version: 0.1.0
revision: 1
title: Notify the authority when reporting is outsourced or resumed internally
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution that outsources major-incident reporting shall inform its competent authority as soon as the arrangement is concluded and before the first outsourced submission, provide the reporting third party's name, contact details and identification code, and inform the authority as soon as the arrangement ends.
requirement_kind: deadline
derivation_type: direct
provision_refs:
  - {provision_id: prv-its-2025-302-art-6, relation: direct_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: all, values: []}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: all, values: []}
  framework_branches: {mode: all, values: []}
  effective_from: "2025-03-12"
  effective_to: null
  conditions:
    - The institution has concluded or ended an arrangement that outsources major-incident reporting.
  exclusions: []
