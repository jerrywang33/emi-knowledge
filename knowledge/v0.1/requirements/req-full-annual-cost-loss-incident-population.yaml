id: req-full-annual-cost-loss-incident-population
type: requirement
schema_version: 0.1.0
revision: 1
title: Include every major incident with reference-year financial impact
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: A requested annual estimate should include every incident classified as major for which the institution submitted a final report in the reference year and every incident with a final report submitted in an earlier reference year that had a quantifiable financial impact in the current reference year.
requirement_kind: condition
derivation_type: direct
provision_refs:
  - {provision_id: prv-jc-gl-2024-34-paragraph-6, relation: direct_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-16-1-simplified-entities, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: include, values: [emi_without_emd2_article_9_1_exemption]}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: not_applicable, values: []}
  framework_branches: {mode: include, values: [dora_full_ict_risk_management]}
  effective_from: "2025-05-19"
  effective_to: null
  conditions:
    - The competent authority has requested an annual estimate under DORA Article 11(10).
  exclusions:
    - Incidents never classified as major.
    - Incidents with no financial impact falling within the reference year.
    - Microenterprises and electronic money institutions using the simplified ICT risk management branch.
