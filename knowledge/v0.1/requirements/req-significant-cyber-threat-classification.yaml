id: req-significant-cyber-threat-classification
type: requirement
schema_version: 0.1.0
revision: 1
title: Apply all significant-cyber-threat classification conditions
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution shall classify a cyber threat as significant only when it could affect critical or important functions or specified external parties, has a high probability of materialisation after considering the prescribed risk, vulnerability, threat-actor, persistence and incident-history factors, and could meet the critical-services criterion, the clients-counterparts-transactions threshold or the geographical-spread threshold.
requirement_kind: condition
derivation_type: combined
provision_refs:
  - {provision_id: prv-dora-art-18-2, relation: direct_basis}
  - {provision_id: prv-rts-2024-1772-art-10, relation: direct_basis}
  - {provision_id: prv-dora-art-3-12, relation: definition_basis}
  - {provision_id: prv-dora-art-3-13, relation: definition_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: all, values: []}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: all, values: []}
  framework_branches: {mode: all, values: []}
  effective_from: "2025-01-17"
  effective_to: null
  conditions:
    - A cyber threat is being assessed using information available to the institution.
  exclusions:
    - Classification as significant does not by itself decide whether the institution will make a voluntary notification.
