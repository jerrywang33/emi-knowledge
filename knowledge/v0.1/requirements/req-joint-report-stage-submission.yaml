id: req-joint-report-stage-submission
type: requirement
schema_version: 0.1.0
revision: 1
title: Combine report stages only when completion and deadlines permit
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution may submit two or all three major-incident report stages together only when regular activities have recovered or root-cause analysis is complete and every deadline applicable to the combined stages is met.
