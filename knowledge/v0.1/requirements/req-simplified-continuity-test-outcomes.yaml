id: req-simplified-continuity-test-outcomes
type: requirement
schema_version: 0.1.0
revision: 1
title: Demonstrate viability and remediate simplified continuity-test deficiencies
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An exempted electronic money institution using the simplified ICT risk management framework shall use continuity-plan testing to demonstrate that it can sustain business viability until critical operations are re-established and to identify deficiencies; it shall document test results and analyse, address and report identified deficiencies to the management body.
requirement_kind: obligation
derivation_type: combined
provision_refs:
  - {provision_id: prv-dora-art-16-1-g, relation: direct_basis}
  - {provision_id: prv-rts-2024-1774-art-40-2-3, relation: direct_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-16-1-simplified-entities, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: include, values: [emi_with_emd2_article_9_1_exemption]}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: not_applicable, values: []}
  framework_branches: {mode: include, values: [dora_simplified_ict_risk_management]}
  effective_from: "2025-01-17"
  effective_to: null
  conditions: []
  exclusions:
    - A successful controlled test does not establish that a later production recovery will succeed.
    - Deficiency severity and remediation deadlines are institution-defined unless another applicable source sets them.
    - Electronic money institutions without the EMD2 Article 9(1) exemption use the full ICT risk management branch.
