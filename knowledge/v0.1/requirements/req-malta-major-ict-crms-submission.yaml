id: req-malta-major-ict-crms-submission
type: requirement
schema_version: 0.1.0
revision: 1
title: Submit Malta major ICT incident reports through CRMS
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An MFSA Authorised Person that is an electronic money institution shall submit every major ICT-related incident notification and report to the MFSA through CRMS within the Licence Holder Portal using the provided template.
requirement_kind: obligation
derivation_type: combined
provision_refs:
  - {provision_id: prv-mfsa-crms-dora-reporting-channel, relation: direct_basis}
  - {provision_id: prv-mfsa-major-process-crms-submission, relation: direct_basis}
  - {provision_id: prv-mfsa-major-process-scope, relation: scope_basis}
  - {provision_id: prv-mfsa-major-process-report-stages, relation: supporting_context}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [MT]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: all, values: []}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: all, values: []}
  framework_branches: {mode: all, values: []}
  effective_from: "2025-01-17"
  effective_to: null
  conditions:
    - The institution is an MFSA Authorised Person within DORA scope.
    - The ICT-related incident has been classified as major.
  exclusions:
    - This requirement does not establish a submission route for a non-ICT operational or security payment-related incident.
