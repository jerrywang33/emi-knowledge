id: req-full-critical-function-continuity-plans
type: requirement
schema_version: 0.1.0
revision: 1
title: Maintain plans that preserve critical or important functions
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution using the full ICT risk management framework shall implement documented arrangements, plans, procedures and mechanisms that ensure continuity of critical or important functions and shall put in place, maintain and periodically test ICT business continuity plans, with particular attention to functions supported through ICT third-party arrangements and severe business disruptions.
requirement_kind: obligation
derivation_type: combined
provision_refs:
