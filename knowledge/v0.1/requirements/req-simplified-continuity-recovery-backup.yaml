id: req-simplified-continuity-recovery-backup
type: requirement
schema_version: 0.1.0
revision: 1
title: Define simplified-framework recovery and backup measures
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An exempted electronic money institution using the simplified ICT risk management framework shall establish planned recovery levels and timeframes for functions and key dependencies, define plan activation conditions and continuity and recovery actions, identify restoration measures for critical or important functions and their supporting processes, information assets and interdependencies, and define backup scope and minimum frequency according to function criticality, including measures that mitigate failures of critical third-party providers.
requirement_kind: obligation
derivation_type: combined
provision_refs:
  - {provision_id: prv-dora-art-16-1-f, relation: direct_basis}
  - {provision_id: prv-rts-2024-1774-art-39-2-d-g, relation: direct_basis}
  - {provision_id: prv-dora-art-3-22, relation: definition_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-16-1-simplified-entities, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: include, values: [emi_with_emd2_article_9_1_exemption]}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: all, values: []}
  framework_branches: {mode: include, values: [dora_simplified_ict_risk_management]}
  effective_from: "2025-01-17"
  effective_to: null
  conditions: []
  exclusions:
    - Recovery levels, timeframes, backup scope and frequencies are institution-defined from documented criticality and dependencies.
    - Electronic money institutions without the EMD2 Article 9(1) exemption use the full ICT risk management branch.
