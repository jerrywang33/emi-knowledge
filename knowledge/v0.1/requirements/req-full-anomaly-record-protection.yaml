id: req-full-anomaly-record-protection
type: requirement
schema_version: 0.1.0
revision: 1
title: Protect anomaly records and capture required timestamps and type
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution using the full ICT risk management framework shall protect anomaly records from tampering and unauthorised access at rest, in transit and where relevant in use, and shall log the occurrence time, detection time and type of each detected anomaly.
requirement_kind: obligation
derivation_type: direct
provision_refs:
  - {provision_id: prv-rts-2024-1774-art-23-3-4, relation: direct_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-16-1-simplified-entities, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: include, values: [emi_without_emd2_article_9_1_exemption]}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: include, values: [operational_data]}
  framework_branches: {mode: include, values: [dora_full_ict_risk_management]}
  effective_from: "2025-01-17"
  effective_to: null
  conditions: []
  exclusions:
    - Electronic money institutions exempted pursuant to Directive 2009/110/EC use the simplified ICT risk management branch.
