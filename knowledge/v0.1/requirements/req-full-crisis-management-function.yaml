id: req-full-crisis-management-function
type: requirement
schema_version: 0.1.0
revision: 1
title: Operate a crisis management function when plans are activated
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: Where an electronic money institution using the full ICT risk management framework is not a microenterprise, it shall maintain a crisis management function that, upon activation of ICT business continuity or response and recovery plans, defines clear procedures for internal and external crisis communication in accordance with DORA Article 14.
requirement_kind: condition
derivation_type: direct
provision_refs:
  - {provision_id: prv-dora-art-11-7-8, relation: direct_basis}
  - {provision_id: prv-dora-art-14-1-3, relation: supporting_context}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-16-1-simplified-entities, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: include, values: [emi_without_emd2_article_9_1_exemption]}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: not_applicable, values: []}
  framework_branches: {mode: include, values: [dora_full_ict_risk_management]}
  effective_from: "2025-01-17"
  effective_to: null
  conditions:
    - The electronic money institution is not a microenterprise as defined by DORA.
    - An ICT business continuity or ICT response and recovery plan has been activated.
  exclusions:
    - Microenterprises are excluded from the crisis management function requirement in DORA Article 11(7).
    - Electronic money institutions exempted pursuant to Directive 2009/110/EC use the simplified ICT risk management branch.
