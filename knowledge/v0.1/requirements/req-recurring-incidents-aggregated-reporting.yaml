id: req-recurring-incidents-aggregated-reporting
type: requirement
schema_version: 0.1.0
revision: 1
title: Report collectively major recurring incidents in aggregated form
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: A non-microenterprise electronic money institution using the full ICT risk management framework shall provide information in aggregated form when recurring incidents that were individually non-major cumulatively meet the prescribed conditions for one major ICT-related incident.
requirement_kind: obligation
derivation_type: combined
provision_refs:
  - {provision_id: prv-rts-2024-1772-art-8-2, relation: direct_basis}
  - {provision_id: prv-its-2025-302-art-3, relation: direct_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-16-1-simplified-entities, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: include, values: [emi_without_emd2_article_9_1_exemption]}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: all, values: []}
  framework_branches: {mode: include, values: [dora_full_ict_risk_management]}
  effective_from: "2025-03-12"
  effective_to: null
  conditions:
    - Recurring non-major incidents cumulatively meet the Regulation (EU) 2024/1772 Article 8(2) conditions for one major incident.
  exclusions:
    - Microenterprises.
    - Electronic money institutions exempted pursuant to Directive 2009/110/EC.
