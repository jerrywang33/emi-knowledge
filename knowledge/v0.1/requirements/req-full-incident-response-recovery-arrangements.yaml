id: req-full-incident-response-recovery-arrangements
type: requirement
schema_version: 0.1.0
revision: 1
title: Maintain documented incident response and recovery arrangements
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution using the full ICT risk management framework shall maintain documented arrangements that rapidly resolve every ICT-related incident, immediately activate suitable containment and recovery plans, estimate preliminary impact, damage and loss, and provide updated internal, external and regulatory communication.
requirement_kind: obligation
derivation_type: direct
provision_refs:
