id: req-major-incident-determination
type: requirement
schema_version: 0.1.0
revision: 1
title: Apply the DORA major-incident combination rule
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution shall treat an ICT-related incident as major when it affects a critical service and either involves successful malicious and unauthorised system access that may result in data loss or meets at least two of the other prescribed client, counterpart, transaction, reputation, duration, downtime, geographical, data-loss or economic-impact materiality thresholds.
requirement_kind: condition
derivation_type: combined
