id: req-full-continuity-business-impact-analysis
type: requirement
schema_version: 0.1.0
revision: 1
title: Conduct a business impact analysis for severe ICT disruption
language: en
lifecycle_status: approved
confirmation: {status: not_required, open_questions: []}
replaces: []
statement: An electronic money institution using the full ICT risk management framework shall conduct a business impact analysis of severe business disruptions using quantitative and qualitative criteria, internal and external data and scenario analysis as appropriate; the analysis shall assess criticality and the impact on functions, supporting processes, third-party dependencies, information assets and interdependencies and shall drive ICT asset and service alignment and redundancy.
requirement_kind: obligation
derivation_type: direct
provision_refs:
  - {provision_id: prv-dora-art-11-5, relation: direct_basis}
  - {provision_id: prv-dora-art-3-22, relation: definition_basis}
  - {provision_id: prv-dora-art-2-1-d, relation: scope_basis}
  - {provision_id: prv-dora-art-16-1-simplified-entities, relation: scope_basis}
  - {provision_id: prv-dora-art-64-application, relation: scope_basis}
  - {provision_id: prv-mfsa-dora-authorisation-continuity-findings, relation: supporting_context}
applicability:
  basis: source_defined
  jurisdictions: {mode: include, values: [EU]}
  entity_types: {mode: include, values: [electronic_money_institution]}
  license_roles: {mode: include, values: [emi_without_emd2_article_9_1_exemption]}
  activities: {mode: include, values: [ict_risk_management]}
  products: {mode: not_applicable, values: []}
  data_categories: {mode: not_applicable, values: []}
  framework_branches: {mode: include, values: [dora_full_ict_risk_management]}
  effective_from: "2025-01-17"
  effective_to: null
  conditions: []
  exclusions:
    - Business impact conclusions and tolerances are institution-specific and require authorised approval.
    - Electronic money institutions exempted pursuant to Directive 2009/110/EC use the simplified ICT risk management branch.
